name: Auto-generate captions

# Runs whenever video content changes on main. Any video without a captions
# file gets transcribed with open-source Whisper (free), the .vtt is committed
# back, and a site deploy is triggered so captions go live automatically.

on:
  push:
    branches:
      - main
    paths:
      - "content/videos/**"
      - "public/uploads/videos/**"
      - "public/videos/**"
  workflow_dispatch:

concurrency:
  group: transcribe
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Don't re-run on our own captions commit.
    if: "!contains(github.event.head_commit.message, '[auto-captions]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v2

      - name: Install faster-whisper
        run: pip install faster-whisper

      - name: Transcribe videos missing captions
        run: python3 scripts/transcribe_videos.py

      - name: Commit captions and trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No new captions generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/uploads/captions content/videos
          git commit -m "Add auto-generated captions [auto-captions]"
          git push origin main
          # Pushes made with GITHUB_TOKEN don't fire the deploy workflow on
          # their own, so kick it off explicitly.
          gh workflow run deploy.yml --ref main
