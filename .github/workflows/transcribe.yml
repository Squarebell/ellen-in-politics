name: Process & caption videos

# When Ellen publishes a video from her iPhone, this workflow:
#   1. Moves/converts .mov to web .mp4, generates poster + duration
#   2. Transcribes audio into .vtt captions + on-page transcript
#   3. Commits results and triggers a site deploy

on:
  push:
    branches:
      - main
    paths:
      - "content/videos/**"
      - "content/posts/**"
      - "public/uploads/videos/**"
      - "public/uploads/covers/**"
      - "public/uploads/posters/**"
      - "public/videos/**"
  workflow_dispatch:

concurrency:
  group: transcribe
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Don't re-run on our own captions commit.
    if: "!contains(github.event.head_commit.message, '[auto-captions]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v2

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Process uploaded videos (mov→mp4, posters, duration)
        run: python3 scripts/process_videos.py

      - name: Install faster-whisper
        run: pip install faster-whisper

      - name: Transcribe videos missing captions
        run: python3 scripts/transcribe_videos.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node deps (media check)
        run: npm ci

      - name: Check CMS media paths
        run: npm run check:media

      - name: Commit captions and trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No new captions generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/uploads/videos public/uploads/posters public/uploads/captions content/videos
          git commit -m "Process videos and add auto-generated captions [auto-captions]"
          git push origin main
          # Pushes made with GITHUB_TOKEN don't fire the deploy workflow on
          # their own, so kick it off explicitly.
          gh workflow run deploy.yml --ref main
