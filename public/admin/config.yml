# Decap CMS — Ellen Carty site
# Update backend.repo + base_url after GitHub OAuth proxy is live.

backend:
  name: github
  repo: Squarebell/ellen-in-politics
  branch: main
  base_url: https://ellen-decap-oauth.squarebell.workers.dev
  auth_endpoint: auth

site_url: https://elleninpolitics.com
logo_url: /favicon.ico
display_url: https://elleninpolitics.com
search: false

# Uploaded media lands in the repo and ships with the next deploy
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: Writing
    label_singular: Post
    folder: content/posts
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    sortable_fields: ["date", "title", "topic"]
    fields:
      - label: Title
        name: title
        widget: string
      - label: Excerpt
        name: excerpt
        widget: text
        hint: "A short one-or-two sentence teaser. Shown on the homepage under the title."
      - label: Publish date
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - label: Topic
        name: topic
        widget: select
        options: ["Civic", "Feminism", "Democracy", "Career", "Policy"]
        default: "Civic"
      - label: Cover image
        name: image
        widget: image
        required: false
        choose_url: true
        media_folder: /public/uploads/covers
        public_folder: /uploads/covers
        hint: "Upload a photo from your iPhone (.jpg, .heic, .png) or paste a link. HEIC is converted automatically after you publish."
      - label: Cover image description
        name: imageAlt
        widget: string
        required: false
        hint: "A short description of the cover image (helps screen readers and search engines), e.g. “Voters waiting in line outside a polling place”."
      - label: Body
        name: body
        widget: markdown
        media_folder: /public/uploads/posts
        public_folder: /uploads/posts
        hint: "Write your post here. Use the + button in the toolbar (or drag & drop) to add images right inside the text. The pane on the right shows how the post will look on the site."

  - name: videos
    label: Watch
    label_singular: Video
    folder: content/videos
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    sortable_fields: ["date", "title"]
    summary: "{{title}} — {{durationLabel}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Eyebrow
        name: eyebrow
        widget: string
        default: "Watch"
        hint: "Small label above the title, e.g. Watch · Policy"
      - label: Description
        name: description
        widget: text
      - label: Publish date
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        hint: "Newest videos show first on the Watch page"
      - label: Duration label
        name: durationLabel
        widget: string
        required: false
        hint: "Optional — filled in automatically from the video after you publish (e.g. 1:30)"
      - label: Orientation
        name: orientation
        widget: select
        options:
          - portrait
          - landscape
        default: portrait
        hint: "portrait = Instagram reel (9:16), landscape = widescreen"
      - label: Video file
        name: video
        widget: file
        # Leading slash = repo root. Without it Decap saves under content/videos/.
        media_folder: /public/uploads/videos
        public_folder: /uploads/videos
        hint: "Upload from your iPhone (.mov or .mp4, under ~95MB). Everything else — thumbnail, duration, captions — is automatic."
      - label: Poster image
        name: poster
        widget: image
        media_folder: /public/uploads/posters
        public_folder: /uploads/posters
        required: false
        hint: "Optional — a thumbnail is grabbed from the video automatically. Upload one (.jpg or .heic) only to override."
      - label: Captions (CC)
        name: captions
        widget: file
        media_folder: /public/uploads/captions
        public_folder: /uploads/captions
        required: false
        hint: "Optional — leave empty and captions are auto-generated a few minutes after you publish. Upload a .vtt here only to use your own."
      - label: Instagram URL
        name: instagramUrl
        widget: string
        required: false
        default: "https://www.instagram.com/elleninpolitics/"
      - label: Timed transcript
        name: transcript
        widget: list
        required: false
        hint: "Optional. Leave empty — the transcript builds itself from the (auto-generated) captions. Use this only to correct or override lines."
        summary: "{{start}}s-{{end}}s {{text}}"
        fields:
          - label: Start (seconds)
            name: start
            widget: number
            value_type: float
            min: 0
            step: 0.1
          - label: End (seconds)
            name: end
            widget: number
            value_type: float
            min: 0
            step: 0.1
          - label: Text
            name: text
            widget: text
      - label: Plain transcript / notes
        name: body
        widget: markdown
        required: false
        hint: "Optional fallback transcript if you don't have a .vtt or timed lines yet."
